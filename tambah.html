<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Daftar Pegawai</title>
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-dark" style="background-color: #1d1d1d;">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Daftar Pegawai Kelompok 4</a>
        </div>
    </nav>

    <!-- DAFTAR -->
    <div class="container mt-5" style="max-width: 600px;">
        <h2 class="text-center mb-4">Form Daftar Pegawai</h2>
        
        <!-- NAMA -->
        <div class="mb-3">
            <label class="form-label fw-bold">Nama:</label>
            <div class="input-group">
                <span class="input-group-text" id="addon-wrapping">Nama</span>
                <input type="text" class="form-control" placeholder="Masukkan Nama" aria-label="Username" aria-describedby="addon-wrapping">
            </div>
        </div>
    <!-- JABATAN -->
     <div class="mb-3">
            <label class="form-label fw-bold">Jabatan Kerja:</label>
            <select class="form-select">
                <option selected disabled>Pilih Jabatan Kerja...</option>
                <option value="Chef">Chef</option>
                <option value="Waiters">Waiters</option>
                <option value="Cashier">Cashier</option>
            </select>
        </div>
    <!-- NO. TELPON-->
     <div class="mb-3">
            <label class="form-label fw-bold">No.Telpon:</label>
            <div class="input-group">
                <span class="input-group-text" id="addon-wrapping">No</span>
                <input type="text" class="form-control" placeholder="Masukkan Nomor" aria-label="Nomor Telpon" aria-describedby="addon-wrapping">
            </div>
        </div>
    <button type="button" class="btn btn-success">Submit</button>
</body>
</html>
